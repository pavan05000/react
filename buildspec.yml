version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies"
      - npm install --legacy-peer-deps
      - npm install styled-components
  build:
    commands:
      - echo "Building React app"
      - npm run build
  post_build:
    commands:
      - echo "Build completed"
      - test -f appspec.yml || (echo "Error: appspec.yml not found" && exit 1)
artifacts:
  files:
    - appspec.yml
    - scripts/**/*
    - build/**/*
    - Dockerfile
    - docker-compose.yml
  base-directory: .
  discard-paths: no
