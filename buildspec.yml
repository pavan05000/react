version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Install phase complete"
  build:
    commands:
      - echo "No build here — handled in Dockerfile"
  post_build:
    commands:
      - echo "Post-build phase complete"
artifacts:
  files:
    - appspec.yml
    - scripts/**/*
    - Dockerfile
    - docker-compose.yml
    - package.json
    - package-lock.json
    - src/**/*
    - public/**/*
  discard-paths: no
